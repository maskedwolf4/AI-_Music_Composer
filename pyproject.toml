[project]
name = "ai-music-composer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maskedwolf4", email = "meetwadekar7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "music21>=10.5.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
    "synthesizer>=0.4.0",
]

[project.scripts]
ai-music-composer = "ai_music_composer:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
